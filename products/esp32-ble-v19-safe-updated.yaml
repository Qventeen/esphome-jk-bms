substitutions:
  name: jk-bms-ble
  device_description: "Monitor and control a JK-BMS v19 via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  mac_address: A4:C1:38:05:17:7D
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  protocol_version: JK02_32S

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "syssi.esphome-jk-bms"
    version: 2.3.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: none
  fast_connect: true

ota:
  platform: esphome
  password: !secret ota_password
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: WARN
  logs:
    esp32_ble_tracker: WARN
    esp32_ble_client: WARN

# If you don't use Home Assistant please remove this `api` section and uncomment the `mqtt` component!
api:
  encryption:
    key: !secret api_encryption_key

# mqtt:
#   broker: !secret mqtt_host
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   id: mqtt_client

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${mac_address}
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "${name} balancing"
    charging:
      name: "${name} charging"
    discharging:
      name: "${name} discharging"
    heating:
      name: "${name} heating"
    online_status:
      name: "${name} online status"
    dry_contact_1:
      name: "${name} dry contact 1"
    dry_contact_2:
      name: "${name} dry contact 2"

button:
  - platform: jk_bms_ble
    retrieve_settings:
      name: "${name} retrieve settings"
      id: btn_retrieve_settings
      on_press:
        then:
          - delay: 2s 
          - component.update: ts_cell_count
          - component.update: ts_total_capacity
          - component.update: ts_balance_trigger
          - component.update: ts_volt_calib
          - component.update: ts_curr_calib
          - component.update: ts_start_bal
          - component.update: ts_max_bal
          - component.update: ts_ovp
          - component.update: ts_rcv
          - component.update: ts_soc100
          - component.update: ts_ovpr
          - component.update: ts_uvpr
          - component.update: ts_soc0
          - component.update: ts_uvp
          - component.update: ts_power_off
          - component.update: ts_rfv
          - component.update: ts_smart_sleep
          - component.update: ts_chg_curr
          - component.update: ts_chg_ocp_delay
          - component.update: ts_chg_ocpr
          - component.update: ts_dis_curr
          - component.update: ts_dis_ocp_delay
          - component.update: ts_dis_ocpr
          - component.update: ts_chg_otp
          - component.update: ts_chg_otpr
          - component.update: ts_dis_otp
          - component.update: ts_dis_otpr
          - component.update: ts_chg_utp
          - component.update: ts_chg_utpr
          - component.update: ts_heat_start
          - component.update: ts_heat_stop
          - component.update: ts_mos_otp
          - component.update: ts_mos_otpr
          - component.update: ts_scp_delay
          - component.update: ts_scpr_time
          - component.update: ts_precharge
          - component.update: ts_rcv_time
          - component.update: ts_rfv_time

    retrieve_device_info:
      name: "${name} retrieve device info"
      # Hardware/Software versions are usually text_sensors 
      # and update automatically, so no extra logic needed here.
      
#I hid all numbers from changes. Only for reading
