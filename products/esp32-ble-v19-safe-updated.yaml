  - platform: template
    id: ts_total_capacity
    name: "${name} Total Battery Capacity"
    unit_of_measurement: "Ah"
    device_class: energy_storage
    entity_category: diagnostic
    accuracy_decimals: 1
    lambda: return id(total_battery_capacity).state;

  - platform: template
    id: ts_balance_trigger
    name: "${name} Balance Trigger Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: diagnostic
    accuracy_decimals: 3
    lambda: return id(balance_trigger_voltage).state;

  - platform: template
